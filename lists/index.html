<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoRita listesi aciliyor</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.12), transparent 34%),
          linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(460px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 28px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }

      .eyebrow {
        display: inline-flex;
        margin: 0 0 14px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.1);
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 16px;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        color: #ffffff;
        box-shadow: 0 16px 32px rgba(37, 99, 235, 0.22);
      }

      .secondary {
        color: #0f172a;
        background: rgba(226, 232, 240, 0.44);
      }

      .meta {
        margin-top: 16px;
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">SoRita</div>
      <h1 id="title">Liste uygulamada aciliyor</h1>
      <p id="message">
        Uygulama yuku ise dogrudan ilgili listeye gececeksiniz. Otomatik acilmazsa asagidaki
        dugmeye basin.
      </p>
      <div class="actions">
        <a id="open-app" class="primary" href="/SoRita_web/download/">Uygulamayi ac</a>
        <a class="secondary" href="/SoRita_web/download/">Indirme sayfasi</a>
      </div>
      <div id="meta" class="meta">Baglanti hazirlaniyor...</div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var listId = params.get("listId");
        var placeId = params.get("placeId");
        var meta = document.getElementById("meta");
        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var button = document.getElementById("open-app");
        var downloadUrl = "/SoRita_web/download/";

        if (!listId) {
          title.textContent = "Liste baglantisi eksik";
          message.textContent =
            "Bu paylasim baglantisinda gerekli liste bilgisi bulunamadi. Indirme sayfasina yonlendirileceksiniz.";
          button.textContent = "Indirme sayfasini ac";
          button.setAttribute("href", downloadUrl);
          meta.textContent = "Eksik liste kimligi.";
          return;
        }

        var appUrl = "sorita://lists/" + encodeURIComponent(listId);
        if (placeId) {
          appUrl += "?placeId=" + encodeURIComponent(placeId);
        }

        button.setAttribute("href", appUrl);
        meta.textContent = "Liste kimligi: " + listId;

        window.setTimeout(function () {
          window.location.assign(appUrl);
        }, 250);

        window.setTimeout(function () {
          if (!document.hidden) {
            window.location.replace(downloadUrl);
          }
        }, 1600);
      })();
    </script>
  </body>
</html>
